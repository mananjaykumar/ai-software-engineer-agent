[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
description = "Production-grade AI Software Engineer Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Add your production runtime dependencies here

    
    # Core & Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",

    # API & Async Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # Database & Storage
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",

    # AST & Code Intelligence
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",

    # AI & Orchestration
    "openai>=1.30.0",
    "langgraph>=0.1.0",
    
    # Sandboxing & Tooling
    "docker>=7.1.0",

    # GitHub App & JWT
    "pyjwt[crypto]>=2.8.0",

]

[project.optional-dependencies]
dev = [
    # Add your testing, linting, and typing dependencies here

    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, etc.)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common design bugs)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
